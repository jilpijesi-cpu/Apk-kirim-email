name: Build Native Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android-native/**'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK & AAB in addition to Debug APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-android:
    name: Build G-Swift Relay Android (APK & AAB)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Release Keystore (if configured in Secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found; building Debug APK (installable) + Unsigned Release APK/AAB."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK & Play Store AAB
        if: ${{ github.event.inputs.build_release != 'false' }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_release != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-release-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Artifact
        if: ${{ github.event.inputs.build_release != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-release-aab
          path: android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Cleanup Temporary Keystore Files
        if: always()
        run: rm -f release.jks keystore.properties

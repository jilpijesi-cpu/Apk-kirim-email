name: Build Native Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android-native/**'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK & AAB in addition to Debug APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-android:
    name: Build G-Swift Relay Android (APK & AAB)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Command-line Tools & API 35)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Command-line tools tidak ditemukan, mengunduh cmdline-tools terbaru..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Release Keystore (if configured in Secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found; building Debug APK (installable) + Unsigned Release APK/AAB."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleDebug 2>&1 | tee /tmp/gradle-debug.log; then
            echo "=== RINGKASAN ERROR GRADLE (DEBUG) ===" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E -A 6 "^(e: |\* What went wrong:|Caused by:|> Task .* FAILED)" /tmp/gradle-debug.log | tail -n 80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Build Release APK & Play Store AAB
        if: ${{ github.event.inputs.build_release != 'false' }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleRelease bundleRelease 2>&1 | tee /tmp/gradle-release.log; then
            echo "=== RINGKASAN ERROR GRADLE (RELEASE) ===" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E -A 6 "^(e: |\* What went wrong:|Caused by:|> Task .* FAILED)" /tmp/gradle-release.log | tail -n 80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Upload Gradle Failure Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: /tmp/gradle-*.log
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_release != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-release-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Artifact
        if: ${{ github.event.inputs.build_release != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: gswift-relay-release-aab
          path: android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Cleanup Temporary Keystore Files
        if: always()
        run: rm -f release.jks keystore.properties
